name: Check CLI and plugin

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: target/release/bukan.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: target/release/bukan
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - run: cargo test --workspace --locked
      - run: uv run --locked --project research-engine pytest research-engine/tests -q
      - run: python -m unittest discover -s scripts -p "test_*.py"
      - run: cargo build --release --locked --bin bukan
      - name: Build plugin bundle
        run: python scripts/package_release.py --binary ${{ matrix.binary }} --target ${{ matrix.target }} --output-dir dist
