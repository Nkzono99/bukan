name: Release desktop app

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-windows:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify release version
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}" -replace '^v', ''
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          $cargoMetadata = cargo metadata --manifest-path src-tauri/Cargo.toml --no-deps --format-version 1 | ConvertFrom-Json
          $cargoVersion = ($cargoMetadata.packages | Where-Object { $_.name -eq 'bukan' }).version

          if ($tagVersion -ne $tauriVersion -or $tagVersion -ne $packageVersion -or $tagVersion -ne $cargoVersion) {
            throw "Tag version $tagVersion must match tauri.conf.json ($tauriVersion), package.json ($packageVersion), and Cargo.toml ($cargoVersion)."
          }

      - name: Run Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Build and publish unsigned installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Bukan ${{ github.ref_name }}
          releaseBody: Windows向けの署名なしNSISインストーラーです。
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false
          args: --bundles nsis
          updaterJsonPreferNsis: true

      - name: Keep updater metadata compatible with installed private-release clients
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $metadataDirectory = Join-Path $env:RUNNER_TEMP "bukan-updater-metadata"
          New-Item -ItemType Directory -Path $metadataDirectory -Force | Out-Null
          gh release download "${{ github.ref_name }}" --pattern latest.json --dir $metadataDirectory --clobber

          $release = gh api "repos/${{ github.repository }}/releases/tags/${{ github.ref_name }}" | ConvertFrom-Json
          $installer = $release.assets |
            Where-Object { $_.name -match '_x64-setup\.exe$' } |
            Select-Object -First 1
          if (-not $installer) {
            throw "The Windows installer asset was not found."
          }

          $metadataPath = Join-Path $metadataDirectory "latest.json"
          $metadata = Get-Content -LiteralPath $metadataPath -Raw | ConvertFrom-Json
          foreach ($platform in $metadata.platforms.PSObject.Properties) {
            $platform.Value.url = $installer.browser_download_url
          }
          $metadata | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath $metadataPath -Encoding utf8
          gh release upload "${{ github.ref_name }}" $metadataPath --clobber
