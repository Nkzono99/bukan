name: Release CLI and plugin

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: target/release/bukan.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: target/release/bukan
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Test Rust
        run: cargo test --workspace --locked
      - name: Test research engine
        run: uv run --locked --project research-engine pytest research-engine/tests -q
      - name: Test packaging
        run: python -m unittest discover -s scripts -p "test_*.py"
      - name: Build CLI
        run: cargo build --release --locked --bin bukan
      - name: Verify tag and build plugin bundle
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/package_release.py --binary "${{ matrix.binary }}" --target "${{ matrix.target }}" --output-dir dist --version "${RELEASE_TAG#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: bukan-${{ matrix.target }}
          path: dist/*.zip
          if-no-files-found: error

  draft-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bukan-*
          path: bundles
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" bundles/*.zip --verify-tag --draft --generate-notes --title "Bukan $RELEASE_TAG"
