name: Release CLI and plugin

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: target/x86_64-pc-windows-msvc/release/bukan.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary: target/x86_64-unknown-linux-musl/release/bukan
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install uv build "hatchling>=1.27,<2"
      - name: Install Linux build and PDF tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools poppler-utils
      - name: Test Rust
        run: cargo test --workspace --locked
      - name: Test research engine
        run: uv run --locked --extra paperpile --project research-engine pytest research-engine/tests -q
      - name: Test packaging
        run: python -m unittest discover -s scripts -p "test_*.py"
      - name: Build CLI
        run: cargo build --release --locked --bin bukan --target ${{ matrix.target }}
      - name: Verify tag and build plugin bundle
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/package_release.py --binary "${{ matrix.binary }}" --target "${{ matrix.target }}" --output-dir dist --version "${RELEASE_TAG#v}"
      - name: Build wheel
        env:
          BUKAN_BUILD_BINARY: ${{ matrix.binary }}
          BUKAN_BUILD_TARGET: ${{ matrix.target }}
        run: python -m build --wheel --outdir dist
      - name: Build source distribution
        if: runner.os == 'Linux'
        run: python -m build --sdist --outdir dist
      - name: Test pip installation and MCPs
        run: python scripts/smoke_wheel.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: bukan-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  draft-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bukan-*
          path: bundles
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" bundles/* --verify-tag --draft --generate-notes --title "Bukan $RELEASE_TAG"
