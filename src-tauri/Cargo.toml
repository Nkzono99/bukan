[package]
name = "bukan"
version = "0.1.0"
description = "A read-only literature workspace for Paperpile"
authors = ["Bukan contributors"]
edition = "2021"

[lib]
name = "bukan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
blake3 = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
